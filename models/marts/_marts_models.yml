models:
  - name: funnel_transitions
    columns:
      - name: funnel_transition_id
        data_tests:
          - unique
          - not_null
      - name: from_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ['lead', 'mql', 'sql', 'opportunity']
      - name: advanced
        data_tests:
          - not_null

  - name: nurture_experiment_accounts
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: assigned_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['treatment', 'holdout']
      - name: converted_within_60d
        data_tests:
          - not_null
          - accepted_values: 
              arguments:
                values: [0, 1]
